<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ralph Mamaril | Portfolio</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(99, 102, 241, 0.4), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(139, 92, 246, 0.3), transparent),
                radial-gradient(2px 2px at 50px 160px, rgba(99, 102, 241, 0.4), transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(139, 92, 246, 0.3), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(99, 102, 241, 0.4), transparent),
                radial-gradient(2px 2px at 160px 120px, rgba(139, 92, 246, 0.3), transparent);
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(15, 15, 35, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar a {
            font-size: 16px;
            color: #fff;
            text-decoration: none;
            margin-left: 35px;
            transition: all 0.3s ease;
            position: relative;
        }

        .navbar a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            transition: width 0.3s ease;
        }

        .navbar a:hover::after,
        .navbar a.active::after {
            width: 100%;
        }

        .navbar a:hover {
            color: #8b5cf6;
        }

        .home {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 100px 10%;
            gap: 80px;
            z-index: 1;
        }

        .home-content {
            flex: 1;
            max-width: 600px;
        }

        .home-content h1 {
            font-size: 52px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 10px;
        }

        .home-content h1 span {
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .home-content h3 {
            font-size: 28px;
            font-weight: 500;
            color: #8b5cf6;
            margin-bottom: 20px;
        }

        .home-content p {
            font-size: 16px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .skill-tag {
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 25px;
            font-size: 14px;
            color: #a5b4fc;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }

        .btn-box {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-box a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .btn-box a:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
        }

        .btn-box a i {
            font-size: 20px;
        }

        .home-img {
            flex: 0 0 350px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img-container {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.5); }
            50% { box-shadow: 0 0 60px rgba(139, 92, 246, 0.8); }
        }

        .img-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #0f0f23;
        }

        .home-sci {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .home-sci a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            background: rgba(99, 102, 241, 0.1);
            border: 2px solid rgba(99, 102, 241, 0.5);
            border-radius: 50%;
            font-size: 24px;
            color: #8b5cf6;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .home-sci a:hover {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border-color: transparent;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        /* Responsive Design */
        @media (max-width: 991px) {
            .home {
                flex-direction: column-reverse;
                text-align: center;
                padding: 120px 5% 50px;
                gap: 40px;
            }

            .home-content h1 {
                font-size: 40px;
            }

            .home-content h3 {
                font-size: 22px;
            }

            .skills {
                justify-content: center;
            }

            .btn-box {
                justify-content: center;
            }

            .home-sci {
                justify-content: center;
            }

            .img-container {
                width: 260px;
                height: 260px;
            }
        }

        @media (max-width: 600px) {
            .header {
                padding: 15px 5%;
            }

            .logo {
                font-size: 22px;
            }

            .navbar a {
                margin-left: 20px;
                font-size: 14px;
            }

            .home-content h1 {
                font-size: 32px;
            }

            .home-content h3 {
                font-size: 18px;
            }

            .img-container {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="#" class="logo">Ralph.</a>
        <nav class="navbar">
            <a href="index.html" class="active">Home</a>
            <a href="#projects">Projects</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <section class="home">
        <div class="home-content">
            <h1>Hi, I'm <span>Ralph Mamaril!</span></h1>
            <h3>Information Technology Student</h3>
            <p>I am eager to start new projects and learn new languages that could challenge my current mindset whilst continuously upskilling.</p>
            
            <div class="skills">
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">Java</span>
                <span class="skill-tag">CSS</span>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">Kotlin</span>
                <span class="skill-tag">Lua</span>
            </div>

            <div class="btn-box">
                <a href="assets/Mamaril-Ralph Luis-Danao.pdf" download>
                    <i class='bx bx-download'></i> Download CV
                </a>
            </div>

            <div class="home-sci">
                <a href="mailto:rlmamaril58@gmail.com" title="Email"><i class='bx bxl-gmail'></i></a>
                <a href="https://www.linkedin.com/in/ralph-mamaril/" target="_blank" title="LinkedIn"><i class='bx bxl-linkedin'></i></a>
                <a href="https://github.com/Rarutech" target="_blank" title="GitHub"><i class='bx bxl-github'></i></a>
            </div>
        </div>

        <div class="home-img">
            <div class="img-container">
                <img src="assets/me.jpg" alt="Ralph Mamaril">
            </div>
        </div>
    </section>
</body>
</html>
